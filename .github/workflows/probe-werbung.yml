# 10-Sekunden-Werbetest (Soul 2 + Seedance 2.5 über Higgsfield), in Stufen. Nur von Hand startbar, OHNE Upload.
#   stufe=bilder  vier Startbilder zur Auswahl (wenige Cent)
#   stufe=video   Clips vom gewählten Bild: erst 480p als Entwurf, dann 1080p. Braucht bilder_lauf.
# Grenze im Skript 5 USD. Mit probe=true entstehen keine Kosten (Platzhalter, nur Schnitt).
# Ziel im Repo: .github/workflows/probe-werbung.yml
name: probe-werbung
on:
  workflow_dispatch:
    inputs:
      stufe:
        description: "bilder = vier Startbilder, video = Clips und Schnitt"
        type: choice
        options: [bilder, video]
        default: bilder
      bilder_lauf:
        description: "Für video: Lauf-Nummer der Stufe bilder (oder eines früheren video-Laufs)"
        required: false
        default: ""
      bild:
        description: "Für video: Nummer des gewählten Startbilds"
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"
      aufloesung:
        description: "Für video: 480p = Entwurf, 1080p = Endfassung"
        type: choice
        options: [480p, 720p, 1080p]
        default: 480p
      takes:
        description: "Für video: Fassungen je Clip"
        type: choice
        options: ["1", "2"]
        default: "1"
      probe:
        description: "Nur Technik testen, ohne Higgsfield und ohne Kosten"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: probe-werbung
  cancel-in-progress: false

jobs:
  probe:
    if: vars.GK_PAUSE != 'ja'
    runs-on: ubuntu-24.04
    environment: produktion
    timeout-minutes: 45
    env:
      GK_ARBEIT: ${{ github.workspace }}/arbeit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Eingaben prüfen
        env:
          LAUF: ${{ inputs.bilder_lauf }}
        run: |
          [[ -z "$LAUF" || "$LAUF" =~ ^[0-9]{6,15}$ ]] || { echo "Lauf-Nummer ungültig"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Material eines früheren Laufs übernehmen
        if: inputs.bilder_lauf != ''
        uses: actions/download-artifact@v4
        with:
          name: probe-werbung-material
          path: arbeit/werbung
          run-id: ${{ inputs.bilder_lauf }}
          github-token: ${{ github.token }}
      - name: Werbetest bauen
        working-directory: 07_Geschichtskanal/produktion
        env:
          HIGGSFIELD_KEY: ${{ secrets.HIGGSFIELD_KEY }}
          STUFE: ${{ inputs.stufe }}
          BILD: ${{ inputs.bild }}
          AUFLOESUNG: ${{ inputs.aufloesung }}
          TAKES: ${{ inputs.takes }}
          PROBE: ${{ inputs.probe }}
        run: |
          args=("$STUFE")
          if [[ "$STUFE" == "video" ]]; then args+=(--bild "$BILD" --aufloesung "$AUFLOESUNG" --takes "$TAKES"); fi
          [[ "$PROBE" == "true" ]] && args+=(--probe)
          python probe_werbung.py "${args[@]}"
      - name: Material sichern (auch bei Fehlern)
        if: always() && inputs.probe != true
        uses: actions/upload-artifact@v4
        with:
          name: probe-werbung-material
          path: |
            arbeit/werbung/start_*.png
            arbeit/werbung/start_urls.json
            arbeit/werbung/clip_*.mp4
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-werbung-ergebnis
          path: |
            arbeit/werbung/auswahl.jpg
            arbeit/werbung/pentest_experts_*.mp4
            arbeit/werbung/pentest_experts_*_bogen.jpg
            arbeit/werbung/info.json
            arbeit/kostenbuch.jsonl
            arbeit/fehler.jsonl
          retention-days: 14
          if-no-files-found: warn
