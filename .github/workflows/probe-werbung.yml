# 10-Sekunden-Werbetest (Soul Cinema + Seedance 2.5 über Higgsfield). Nur von Hand startbar, OHNE Upload.
# Kosten: etwa 1 USD (Grenze im Skript 4 USD). Mit probe=true entstehen keine Kosten (Platzhalter, nur Schnitt).
# Mit clips_lauf werden Startbild und Clips eines früheren Laufs übernommen (neu schneiden ohne neue Kosten).
# Ziel im Repo: .github/workflows/probe-werbung.yml
name: probe-werbung
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Nur Schnitt testen, ohne Higgsfield und ohne Kosten"
        type: boolean
        default: false
      einblendung:
        description: "Warnzeile 'RANSOMWARE – ALLE DATEN VERSCHLÜSSELT' ab Sekunde 2 einblenden"
        type: boolean
        default: false
      clips_lauf:
        description: "Optional: Lauf-Nummer eines früheren Laufs, dessen Clips übernommen werden"
        required: false
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: probe-werbung
  cancel-in-progress: false

jobs:
  probe:
    if: vars.GK_PAUSE != 'ja'
    runs-on: ubuntu-24.04
    environment: produktion
    timeout-minutes: 45
    env:
      GK_ARBEIT: ${{ github.workspace }}/arbeit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Eingaben prüfen
        env:
          CLIPS_LAUF: ${{ inputs.clips_lauf }}
        run: |
          [[ -z "$CLIPS_LAUF" || "$CLIPS_LAUF" =~ ^[0-9]{6,15}$ ]] || { echo "Lauf-Nummer ungültig"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Clips eines früheren Laufs übernehmen
        if: inputs.clips_lauf != ''
        uses: actions/download-artifact@v4
        with:
          name: probe-werbung-clips
          path: arbeit/werbung
          run-id: ${{ inputs.clips_lauf }}
          github-token: ${{ github.token }}
      - name: Werbetest bauen
        working-directory: 07_Geschichtskanal/produktion
        env:
          HIGGSFIELD_KEY: ${{ secrets.HIGGSFIELD_KEY }}
          PROBE: ${{ inputs.probe }}
          EINBLENDUNG: ${{ inputs.einblendung }}
        run: |
          args=()
          [[ "$PROBE" == "true" ]] && args+=(--probe)
          [[ "$EINBLENDUNG" == "true" ]] && args+=(--einblendung)
          python probe_werbung.py "${args[@]}"
      - name: Clips sichern (auch bei Fehlern)
        if: always() && inputs.probe != true
        uses: actions/upload-artifact@v4
        with:
          name: probe-werbung-clips
          path: |
            arbeit/werbung/clip_a.mp4
            arbeit/werbung/clip_b.mp4
            arbeit/werbung/start.png
            arbeit/werbung/start_url.txt
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-werbung-ergebnis
          path: |
            arbeit/werbung/pentest_experts_10s.mp4
            arbeit/werbung/kontaktbogen.jpg
            arbeit/werbung/info.json
            arbeit/kostenbuch.jsonl
            arbeit/fehler.jsonl
          retention-days: 14
          if-no-files-found: warn
