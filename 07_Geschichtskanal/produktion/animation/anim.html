<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Animation</title>
<!-- Allgemeine 2,5D-Animation: Bilder und Zeiten kommen aus window.KONF (render_anim.mjs). Schwarz-Weiß-Filmlook. -->
<style>html, body { margin: 0; background: #000; } #c { width: 100vw; height: auto; display: block; } #gl { display: none; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<canvas id="gl" width="1920" height="1080"></canvas>
<script>
"use strict";
const W = 1920, H = 1080, FPS = 30;
const ctx = document.getElementById("c").getContext("2d");
const glc = document.getElementById("gl");
const gl = glc.getContext("webgl", { preserveDrawingBuffer: true, premultipliedAlpha: false });
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => (x = clamp(x), x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const lerp = (a, b, t) => a + (b - a) * t;
function zufall(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------- WebGL: Bild als 2,5D-Ebene ------------------------------------
// Tiefe wird aus der Bildhöhe geschätzt (unten = nah, Himmel = fern) und mit der Helligkeit leicht moduliert.
// Dazu: Wind-Wellen und Hitzeflimmern in frei wählbaren Bereichen.
const VS = `attribute vec2 p; varying vec2 uv; void main(){ uv = p*.5+.5; uv.y = 1.-uv.y; gl_Position = vec4(p,0.,1.); }`;
const FS = `precision highp float; varying vec2 uv; uniform sampler2D bild; uniform float t, zoom, tiefe;
uniform vec2 kam; uniform vec4 wind; uniform float windStaerke; uniform vec4 hitze; uniform float hitzeStaerke; uniform float beben;
float im(vec4 r, vec2 q){ vec2 a = smoothstep(r.xy, r.xy+.04, q) * (1.-smoothstep(r.zw-.04, r.zw, q)); return a.x*a.y; }
void main(){
  vec2 q = uv;
  float d = pow(q.y, 1.6);                       // 0 = Himmel/fern, 1 = Vordergrund/nah
  vec2 z = (q - .5) / zoom + .5;
  z += kam * (.25 + d * tiefe);                   // Parallaxe: nahe Teile bewegen sich mehr
  z += vec2(sin(t*31.)*.0025, cos(t*27.)*.002) * beben;
  float w = im(wind, q);
  z.x += sin(q.y*38. + t*2.3) * .0035 * w * windStaerke;
  z.y += cos(q.x*24. + t*1.7) * .002 * w * windStaerke;
  float h = im(hitze, q);
  z += vec2(sin(q.y*90.+t*9.), cos(q.x*70.+t*7.)) * .0018 * h * hitzeStaerke;
  gl_FragColor = texture2D(bild, clamp(z, .001, .999));
}`;
function shader(typ, src) { const s = gl.createShader(typ); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const prog = gl.createProgram(); gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const ap = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const texturen = [];
function ladeBild(src) { return new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; }); }
function textur(img) { const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); return tx; }
function ebene(nr, t, o) {
  gl.viewport(0, 0, W, H); gl.bindTexture(gl.TEXTURE_2D, texturen[nr]);
  gl.uniform1f(U("t"), t); gl.uniform1f(U("zoom"), o.zoom ?? 1.08); gl.uniform1f(U("tiefe"), o.tiefe ?? 1);
  gl.uniform2f(U("kam"), o.kx ?? 0, o.ky ?? 0);
  gl.uniform4fv(U("wind"), o.wind ?? [0, 0, 0, 0]); gl.uniform1f(U("windStaerke"), o.windS ?? 0);
  gl.uniform4fv(U("hitze"), o.hitze ?? [0, 0, 0, 0]); gl.uniform1f(U("hitzeStaerke"), o.hitzeS ?? 0);
  gl.uniform1f(U("beben"), o.beben ?? 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ctx.drawImage(glc, 0, 0);
}

// ---------- Überlagerungen im selben Stil ----------------------------------
const FARBE = { creme: "#efe3c8", dunkel: "#1d1a24", lila: "#4a3d55", rauch: "#3b3142", glut: "#e86a2c", gold: "#f2b84b", asche: "#9a948c" };
function vogel(x, y, s, t) { const f = Math.sin(t * 13) * 9; ctx.strokeStyle = FARBE.dunkel; ctx.lineWidth = 4 * s; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x - 18 * s, y + f * s); ctx.quadraticCurveTo(x - 6 * s, y - 7 * s, x, y); ctx.quadraticCurveTo(x + 6 * s, y - 7 * s, x + 18 * s, y + f * s); ctx.stroke(); }
function schwarm(t, x0, y0, v, n = 7, s = 1) { for (let i = 0; i < n; i++) vogel(x0 + i * 62 * s + t * v + Math.sin(i * 1.7) * 30, y0 + Math.sin(i * 2.1 + t * .8) * 22, s, t + i * .37); }
function wolke(x, y, s, farbe = FARBE.creme, a = 1) { ctx.globalAlpha = a; ctx.fillStyle = farbe; ctx.beginPath();
  [[0, 0, 46], [52, -16, 38], [98, 0, 42], [48, 14, 40]].forEach(([dx, dy, r]) => { ctx.moveTo(x + dx * s + r * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); }); ctx.fill(); ctx.globalAlpha = 1; }
function rauchsaeule(x, y, t, hoehe, staerke = 1) { // quellende Ballen, die aufsteigen und wachsen
  const r = zufall(17);
  for (let i = 0; i < 70; i++) {
    const phase = (t * .18 + r()) % 1, yy = y - phase * hoehe;
    const breite = 30 + phase * phase * 520, rad = (18 + phase * 120) * (0.7 + r() * .6);
    const xx = x + (r() - .5) * breite + Math.sin(t * 1.1 + i) * 14;
    ctx.globalAlpha = staerke * (phase < .08 ? phase / .08 : 1) * .92;
    ctx.fillStyle = i % 4 ? FARBE.rauch : FARBE.lila;
    ctx.beginPath(); ctx.arc(xx, yy, rad, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function glut(x, y, t, r = 60) { const p = .75 + .25 * Math.sin(t * 7) * Math.sin(t * 3.3); const v = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
  v.addColorStop(0, `rgba(255,140,60,${.75 * p})`); v.addColorStop(1, "rgba(255,90,30,0)"); ctx.fillStyle = v; ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6); }
function asche(t, menge, seed = 3, wind = 40) { const r = zufall(seed); ctx.fillStyle = FARBE.asche;
  for (let i = 0; i < menge; i++) { const sp = 90 + r() * 170; const x = ((r() * W + t * wind * (r() + .3)) % W + W) % W, y = (r() * H + t * sp) % H;
    ctx.globalAlpha = .45 + r() * .5; ctx.beginPath(); ctx.arc(x, y, 1.5 + r() * 4, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
function staub(t, menge, seed = 8) { const r = zufall(seed); ctx.fillStyle = "#fff6dc";
  for (let i = 0; i < menge; i++) { const x = (r() * W + Math.sin(t * .5 + i) * 30), y = (r() * H - t * (8 + r() * 14) + H) % H; ctx.globalAlpha = .25 + .25 * Math.sin(t * 2 + i); ctx.beginPath(); ctx.arc(x, y, 1.5 + r() * 2.5, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
function strahlen(x, y, t, n = 6, a = .12) { ctx.save(); ctx.translate(x, y); ctx.globalAlpha = a; ctx.fillStyle = "#fff7e0";
  for (let i = 0; i < n; i++) { ctx.save(); ctx.rotate(.55 + i * .16 + Math.sin(t * .4 + i) * .03); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-40, 1600); ctx.lineTo(40, 1600); ctx.fill(); ctx.restore(); } ctx.restore(); }
function wort(text, t, dauer, y = H - 150) { const ein = ease(t / .35), aus = clamp((dauer - t) / .3), a = Math.min(ein, aus); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, y); const s = .82 + .18 * ein; ctx.scale(s, s);
  ctx.font = "900 100px Montserrat, 'Segoe UI', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const b = ctx.measureText(text).width + 80; ctx.fillStyle = "rgba(24,20,30,.78)"; ctx.beginPath(); ctx.roundRect(-b / 2, -74, b, 148, 16); ctx.fill();
  ctx.fillStyle = FARBE.creme; ctx.fillText(text, 0, 6); ctx.restore(); }
function korn(t) { const r = zufall((t * 24) | 0); ctx.globalAlpha = .05; ctx.fillStyle = "#000"; for (let i = 0; i < 1400; i++) ctx.fillRect(r() * W, r() * H, 2, 2); ctx.globalAlpha = 1; }
function vignette(st = .42) { const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, `rgba(0,0,0,${st})`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); }

// ---------- Allgemeine Animation: Szenen kommen aus window.KONF (von render_anim.mjs gesetzt) ----------
// KONF: { bilder: "…/", zeiten: [0, 4.1, …, ende], szenen: [{ bewegung, fx, wort, tiefe, beben }], sw: true }
const KONF = Object.assign({ bilder: "bilder/", zeiten: [0, 4, 8], szenen: [{}, {}], sw: true }, window.KONF || {});
const Z = KONF.zeiten, ENDE = Z[Z.length - 1], SZENEN = KONF.szenen;

// Schwarz-Weiß-Effekte im Stil eines alten Films
function nebel(t, a = .16, seed = 5) { const r = zufall(seed);
  for (let i = 0; i < 9; i++) { const x = ((r() * W + t * (18 + r() * 26)) % (W + 600)) - 300, y = H * (.35 + r() * .6), rad = 220 + r() * 260;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, `rgba(235,235,235,${a})`); g.addColorStop(1, "rgba(235,235,235,0)");
    ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2); } }
function flackern(t) { const r = zufall((t * 12) | 0); const a = r() * .07; ctx.fillStyle = r() > .5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a * 1.6})`; ctx.fillRect(0, 0, W, H); }
function kratzer(t) { const r = zufall((t * 8) | 0); ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.lineWidth = 1.5;
  for (let i = 0; i < 2; i++) { if (r() > .45) continue; const x = r() * W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (r() - .5) * 14, H); ctx.stroke(); }
  ctx.fillStyle = "rgba(255,255,255,.5)"; for (let i = 0; i < 5; i++) if (r() > .6) ctx.fillRect(r() * W, r() * H, 2 + r() * 4, 2 + r() * 4); }
function lichtpuls(t, x = W / 2, y = H * .3) { const p = .5 + .5 * Math.sin(t * 5.3) * Math.sin(t * 2.1), g = ctx.createRadialGradient(x, y, 0, x, y, H * .7);
  g.addColorStop(0, `rgba(255,255,255,${.10 + .08 * p})`); g.addColorStop(1, "rgba(255,255,255,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function schneestaub(t, menge = 70, seed = 9) { const r = zufall(seed); ctx.fillStyle = "#fff";
  for (let i = 0; i < menge; i++) { const x = r() * W + Math.sin(t * .6 + i) * 40, y = (r() * H + t * (12 + r() * 30)) % H; ctx.globalAlpha = .12 + .3 * Math.abs(Math.sin(t * 1.5 + i)); ctx.beginPath(); ctx.arc(x, y, 1.2 + r() * 2.6, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
function wortSW(text, t, dauer) { const ein = ease(t / .35), aus = clamp((dauer - t) / .3), a = Math.min(ein, aus); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H - 150); const s = .85 + .15 * ein; ctx.scale(s, s);
  ctx.font = "900 100px Montserrat, 'Segoe UI', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const b = ctx.measureText(text).width + 90; ctx.fillStyle = "rgba(245,245,245,.96)"; ctx.fillRect(-b / 2, -76, b, 152);
  ctx.fillStyle = "#0b0b0b"; ctx.fillText(text, 0, 6); ctx.restore(); }
function kamera(bew, t, d) { const p = ease(t / d);
  switch (bew) {
    case "zoom_rein": return { zoom: 1.06 + .07 * p };
    case "zoom_raus": return { zoom: 1.16 - .09 * p };
    case "schwenk_rechts": return { zoom: 1.12, kx: .04 * (p - .5) };
    case "schwenk_links": return { zoom: 1.12, kx: -.04 * (p - .5) };
    case "punch": return { zoom: 1.24 - .14 * ease(t / .5) + .02 * p };
    default: return { zoom: 1.08 + .02 * p, kx: .005 * Math.sin(t * .4) };
  } }

function szeneBei(t) { let n = 1; while (n < Z.length - 1 && t >= Z[n]) n++; return n; }
function zeichne(t) {
  const n = szeneBei(t), lt = t - Z[n - 1], d = Z[n] - Z[n - 1], s = SZENEN[n - 1] || {}, k = kamera(s.bewegung, lt, d), fx = (s.fx || "staub").split(" ");
  const beben = s.beben ? s.beben * clamp(lt / .3) * (1 - clamp((lt - d * .6) / (d * .4))) : 0;
  ctx.clearRect(0, 0, W, H);
  ctx.filter = KONF.sw ? "grayscale(1) contrast(1.18)" : "none";
  ebene(n, t, { zoom: k.zoom, kx: k.kx || 0, tiefe: s.tiefe ?? 1.1, beben, wind: s.wind, windS: s.windS });
  ctx.filter = "none";
  if (fx.includes("licht")) lichtpuls(lt);
  if (fx.includes("nebel")) nebel(t);
  if (fx.includes("staub")) schneestaub(t);
  if (s.wort) wortSW(s.wort, lt - .5, d - .5);
  if (lt < .2) { ctx.fillStyle = `rgba(0,0,0,${(1 - lt / .2) * .95})`; ctx.fillRect(0, 0, W, H); }
  vignette(KONF.filmlook ? .62 : .38);
  if (KONF.filmlook) { korn(t); korn(t + .31); flackern(t); kratzer(t); }   // sauberer Vektor-Look ist Standard
  if (t > ENDE - .7) { ctx.fillStyle = `rgba(0,0,0,${clamp((t - ENDE + .7) / .7)})`; ctx.fillRect(0, 0, W, H); }
}
window.zeige = async t => zeichne(t);

(async () => {
  const bilder = await Promise.all(SZENEN.map((_, i) => ladeBild(`${KONF.bilder}bild_${String(i + 1).padStart(3, "0")}.png`)));
  bilder.forEach((b, i) => texturen[i + 1] = textur(b));
  try { await document.fonts.load("900 100px Montserrat"); } catch (e) {}
  zeichne(.5);
  window.bereit = true;
})();
</script>
</body>
</html>
