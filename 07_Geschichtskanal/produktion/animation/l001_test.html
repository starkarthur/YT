<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L001 Animationstest</title>
<!-- 2,5D-Animation der L001-Bilder + realistische KI-Einschübe. Lokal: Vorschau mit Ton (Clips als Platzhalter).
     In der Cloud setzt render.mjs window.KONF (Pfade, Szenenzeiten, Clip-Bilder) und ruft zeige(t) Bild für Bild auf. -->
<style>
  :root { --bg: #0d1014; --fg: #ecdec4; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Montserrat", "Segoe UI", sans-serif; overflow: hidden; }
  #buehne { position: fixed; inset: 0; display: grid; place-items: center; }
  #c { width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; display: block; background: #000; }
  #gl { display: none; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(13,16,20,.7); cursor: pointer; }
  #start div { padding: 18px 28px; border: 2px solid var(--fg); border-radius: 10px; font-weight: 800; letter-spacing: .05em; }
  #info { position: fixed; left: 12px; bottom: 10px; font: 12px monospace; opacity: .6; }
</style>
</head>
<body>
<div id="buehne"><canvas id="c" width="1920" height="1080"></canvas></div>
<canvas id="gl" width="1920" height="1080"></canvas>
<div id="start"><div>▶ ABSPIELEN – 1-Minuten-Test (mit Ton)</div></div>
<div id="info">lädt …</div>
<video id="ton" src="../L001/medien/L001/L001_final.mp4" preload="auto" style="display:none"></video>
<script>
"use strict";
const W = 1920, H = 1080, FPS = 30;
const ctx = document.getElementById("c").getContext("2d");
const glc = document.getElementById("gl");
const gl = glc.getContext("webgl", { preserveDrawingBuffer: true, premultipliedAlpha: false });
const ton = document.getElementById("ton");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => (x = clamp(x), x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const lerp = (a, b, t) => a + (b - a) * t;
function zufall(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------- WebGL: Bild als 2,5D-Ebene ------------------------------------
// Tiefe wird aus der Bildhöhe geschätzt (unten = nah, Himmel = fern) und mit der Helligkeit leicht moduliert.
// Dazu: Wind-Wellen und Hitzeflimmern in frei wählbaren Bereichen.
const VS = `attribute vec2 p; varying vec2 uv; void main(){ uv = p*.5+.5; uv.y = 1.-uv.y; gl_Position = vec4(p,0.,1.); }`;
const FS = `precision highp float; varying vec2 uv; uniform sampler2D bild; uniform float t, zoom, tiefe;
uniform vec2 kam; uniform vec4 wind; uniform float windStaerke; uniform vec4 hitze; uniform float hitzeStaerke; uniform float beben;
float im(vec4 r, vec2 q){ vec2 a = smoothstep(r.xy, r.xy+.04, q) * (1.-smoothstep(r.zw-.04, r.zw, q)); return a.x*a.y; }
void main(){
  vec2 q = uv;
  float d = pow(q.y, 1.6);                       // 0 = Himmel/fern, 1 = Vordergrund/nah
  vec2 z = (q - .5) / zoom + .5;
  z += kam * (.25 + d * tiefe);                   // Parallaxe: nahe Teile bewegen sich mehr
  z += vec2(sin(t*31.)*.0025, cos(t*27.)*.002) * beben;
  float w = im(wind, q);
  z.x += sin(q.y*38. + t*2.3) * .0035 * w * windStaerke;
  z.y += cos(q.x*24. + t*1.7) * .002 * w * windStaerke;
  float h = im(hitze, q);
  z += vec2(sin(q.y*90.+t*9.), cos(q.x*70.+t*7.)) * .0018 * h * hitzeStaerke;
  gl_FragColor = texture2D(bild, clamp(z, .001, .999));
}`;
function shader(typ, src) { const s = gl.createShader(typ); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const prog = gl.createProgram(); gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const ap = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const texturen = [];
function ladeBild(src) { return new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; }); }
function textur(img) { const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); return tx; }
function ebene(nr, t, o) {
  gl.viewport(0, 0, W, H); gl.bindTexture(gl.TEXTURE_2D, texturen[nr]);
  gl.uniform1f(U("t"), t); gl.uniform1f(U("zoom"), o.zoom ?? 1.08); gl.uniform1f(U("tiefe"), o.tiefe ?? 1);
  gl.uniform2f(U("kam"), o.kx ?? 0, o.ky ?? 0);
  gl.uniform4fv(U("wind"), o.wind ?? [0, 0, 0, 0]); gl.uniform1f(U("windStaerke"), o.windS ?? 0);
  gl.uniform4fv(U("hitze"), o.hitze ?? [0, 0, 0, 0]); gl.uniform1f(U("hitzeStaerke"), o.hitzeS ?? 0);
  gl.uniform1f(U("beben"), o.beben ?? 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ctx.drawImage(glc, 0, 0);
}

// ---------- Überlagerungen im selben Stil ----------------------------------
const FARBE = { creme: "#efe3c8", dunkel: "#1d1a24", lila: "#4a3d55", rauch: "#3b3142", glut: "#e86a2c", gold: "#f2b84b", asche: "#9a948c" };
function vogel(x, y, s, t) { const f = Math.sin(t * 13) * 9; ctx.strokeStyle = FARBE.dunkel; ctx.lineWidth = 4 * s; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x - 18 * s, y + f * s); ctx.quadraticCurveTo(x - 6 * s, y - 7 * s, x, y); ctx.quadraticCurveTo(x + 6 * s, y - 7 * s, x + 18 * s, y + f * s); ctx.stroke(); }
function schwarm(t, x0, y0, v, n = 7, s = 1) { for (let i = 0; i < n; i++) vogel(x0 + i * 62 * s + t * v + Math.sin(i * 1.7) * 30, y0 + Math.sin(i * 2.1 + t * .8) * 22, s, t + i * .37); }
function wolke(x, y, s, farbe = FARBE.creme, a = 1) { ctx.globalAlpha = a; ctx.fillStyle = farbe; ctx.beginPath();
  [[0, 0, 46], [52, -16, 38], [98, 0, 42], [48, 14, 40]].forEach(([dx, dy, r]) => { ctx.moveTo(x + dx * s + r * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, r * s, 0, 7); }); ctx.fill(); ctx.globalAlpha = 1; }
function rauchsaeule(x, y, t, hoehe, staerke = 1) { // quellende Ballen, die aufsteigen und wachsen
  const r = zufall(17);
  for (let i = 0; i < 70; i++) {
    const phase = (t * .18 + r()) % 1, yy = y - phase * hoehe;
    const breite = 30 + phase * phase * 520, rad = (18 + phase * 120) * (0.7 + r() * .6);
    const xx = x + (r() - .5) * breite + Math.sin(t * 1.1 + i) * 14;
    ctx.globalAlpha = staerke * (phase < .08 ? phase / .08 : 1) * .92;
    ctx.fillStyle = i % 4 ? FARBE.rauch : FARBE.lila;
    ctx.beginPath(); ctx.arc(xx, yy, rad, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function glut(x, y, t, r = 60) { const p = .75 + .25 * Math.sin(t * 7) * Math.sin(t * 3.3); const v = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
  v.addColorStop(0, `rgba(255,140,60,${.75 * p})`); v.addColorStop(1, "rgba(255,90,30,0)"); ctx.fillStyle = v; ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6); }
function asche(t, menge, seed = 3, wind = 40) { const r = zufall(seed); ctx.fillStyle = FARBE.asche;
  for (let i = 0; i < menge; i++) { const sp = 90 + r() * 170; const x = ((r() * W + t * wind * (r() + .3)) % W + W) % W, y = (r() * H + t * sp) % H;
    ctx.globalAlpha = .45 + r() * .5; ctx.beginPath(); ctx.arc(x, y, 1.5 + r() * 4, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
function staub(t, menge, seed = 8) { const r = zufall(seed); ctx.fillStyle = "#fff6dc";
  for (let i = 0; i < menge; i++) { const x = (r() * W + Math.sin(t * .5 + i) * 30), y = (r() * H - t * (8 + r() * 14) + H) % H; ctx.globalAlpha = .25 + .25 * Math.sin(t * 2 + i); ctx.beginPath(); ctx.arc(x, y, 1.5 + r() * 2.5, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
function strahlen(x, y, t, n = 6, a = .12) { ctx.save(); ctx.translate(x, y); ctx.globalAlpha = a; ctx.fillStyle = "#fff7e0";
  for (let i = 0; i < n; i++) { ctx.save(); ctx.rotate(.55 + i * .16 + Math.sin(t * .4 + i) * .03); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-40, 1600); ctx.lineTo(40, 1600); ctx.fill(); ctx.restore(); } ctx.restore(); }
function wort(text, t, dauer, y = H - 150) { const ein = ease(t / .35), aus = clamp((dauer - t) / .3), a = Math.min(ein, aus); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, y); const s = .82 + .18 * ein; ctx.scale(s, s);
  ctx.font = "900 100px Montserrat, 'Segoe UI', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const b = ctx.measureText(text).width + 80; ctx.fillStyle = "rgba(24,20,30,.78)"; ctx.beginPath(); ctx.roundRect(-b / 2, -74, b, 148, 16); ctx.fill();
  ctx.fillStyle = FARBE.creme; ctx.fillText(text, 0, 6); ctx.restore(); }
function korn(t) { const r = zufall((t * 24) | 0); ctx.globalAlpha = .05; ctx.fillStyle = "#000"; for (let i = 0; i < 1400; i++) ctx.fillRect(r() * W, r() * H, 2, 2); ctx.globalAlpha = 1; }
function vignette(st = .42) { const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, `rgba(0,0,0,${st})`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); }

// ---------- Einstellungen -----------------------------------------------------
const KONF = Object.assign({
  bilder: "../L001/bilder/",   // bild_NNN.png
  clips: null,                 // Ordner mit e1/0001.jpg … (null = Platzhalter)
  clipInfo: {},                // {"4": {"name": "e1", "frames": 150}, …}
  // Szenenanfänge 1–14 + Ende (lokal geschätzt; in der Cloud aus L001_final.mp4 gemessen)
  zeiten: [0, 1.7, 4.9, 9.8, 15.3, 19.5, 23.4, 28.2, 33.6, 39.4, 44.4, 48.6, 54.8, 59.8, 63.9],
}, window.KONF || {});
const Z = KONF.zeiten, ENDE = Z[Z.length - 1];

// ---------- Realistischer Einschub ------------------------------------------
const clipCache = new Map();
function clipBildNr(nr, t, d) {
  const info = KONF.clipInfo[nr]; if (!info) return null;
  const rate = Math.min(1, (info.frames / FPS - .05) / d);          // länger als der Clip → leicht verlangsamt
  return { info, k: Math.min(info.frames, 1 + Math.floor(t * rate * FPS)) };
}
async function clipLaden(nr, t, d) {
  const c = clipBildNr(nr, t, d); if (!c || !KONF.clips) return;
  const key = `${c.info.name}/${String(c.k).padStart(4, "0")}`;
  if (clipCache.has(key)) return;
  clipCache.set(key, await ladeBild(`${KONF.clips}${key}.jpg`));
  if (clipCache.size > 12) clipCache.delete(clipCache.keys().next().value);
}
function echt(nr, t, d, ersatzBild) {
  const c = clipBildNr(nr, t, d);
  const img = c && clipCache.get(`${c.info.name}/${String(c.k).padStart(4, "0")}`);
  const s = 1.02 + .05 * ease(t / d);                               // langsames Hineinfahren
  if (img) {
    ctx.save(); ctx.filter = "saturate(.86) contrast(1.07) sepia(.14)";
    ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.drawImage(img, -W / 2, -H / 2, W, H); ctx.restore();
    ctx.fillStyle = "rgba(70,40,60,.10)"; ctx.fillRect(0, 0, W, H); // Farbstimmung an die Illustrationen angleichen
  } else {                                                          // lokale Vorschau ohne Clip
    ebene(ersatzBild, t, { zoom: 1.08 }); ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = FARBE.creme; ctx.font = "700 54px Montserrat, 'Segoe UI', sans-serif"; ctx.textAlign = "center";
    ctx.fillText(`REALER KI-CLIP (Szene ${nr})`, W / 2, H / 2);
  }
  korn(t * 1.3); korn(t * 1.3 + .5);                                // etwas mehr Korn auf dem Realbild
}

// ---------- Szenen (Nummer = Szene/Bild aus L001) ----------------------------
const SZ = {
  1(t, d) { ebene(1, t, { zoom: 1.22 - .14 * ease(t / .55), kx: .02 * t, tiefe: 1.4 });
    schwarm(t, 1180, 190, 120, 6, .8); staub(t, 40); wort("POMPEII", t - .15, d - .15); },
  2(t, d) { ebene(2, t, { zoom: 1.08, kx: -.012 * t, ky: .004 * t, tiefe: 1, wind: [.06, .05, .36, .62], windS: 1.4 });
    for (let i = 0; i < 4; i++) wolke(((300 + i * 420 + t * 34) % 2200) - 150, 60 + (i % 2) * 40, .55, "#f7e9cf", .9);
    strahlen(1500, -80, t, 5, .1); staub(t, 70, 9); },
  3(t, d) { ebene(3, t, { zoom: 1.06 + .01 * t, kx: .01 * t, tiefe: 1.3, wind: [.62, .45, .9, .9], windS: .5 });
    for (let i = 0; i < 4; i++) wolke(((i * 560 + t * 28) % 2300) - 200, 120 + (i % 2) * 70, .9, "#fbf3e2", .95);
    schwarm(t, -200, 250, 160, 7, .7); },
  4: { echt: true, f(t, d) { echt(4, t, d, 4); asche(t, Math.floor(260 * clamp((t - .5) / 2)), 9, 30); wort("BURIED", t - 1.2, d - 1.2); } },
  5(t, d) { ebene(5, t, { zoom: 1.06, kx: .006 * t, tiefe: .6 });
    const cx = 492, cy = 548, r = 352, p = ease(t / 2.4);
    ctx.lineCap = "round"; ctx.strokeStyle = "rgba(232,106,44,.92)"; ctx.lineWidth = 34;
    ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * .75 * p); ctx.stroke();
    const z = -Math.PI / 2 + Math.PI * 2 * .75 * p; ctx.strokeStyle = FARBE.dunkel; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(z) * 250, cy + Math.sin(z) * 250); ctx.stroke();
    glut(1555, 300, t * 1.5, 40); wort("18 HOURS", t - .3, d - .3); },
  6(t, d) { ebene(6, t, { zoom: 1.12, kx: -.03 * ease(t / d), tiefe: 1.6, wind: [.0, .25, .32, .8], windS: 1.2 });
    asche(t, 90, 4, 60); wolke(((t * 40) % 2300) - 200, 90, .7, "#fbf3e2", .9); },
  7(t, d) { ebene(7, t, { zoom: 1.08 + .015 * t, ky: .004 * t, tiefe: 1.1, hitze: [.3, .3, .7, .5], hitzeS: .6 });
    const a = -.55 + .5 * ease(t / d); ctx.save(); ctx.translate(1120, 900); ctx.rotate(a); ctx.fillStyle = "rgba(20,24,32,.35)";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-30, -420); ctx.lineTo(30, -420); ctx.fill(); ctx.restore();
    strahlen(1220, 300, t, 8, .08); staub(t, 50, 12); },
  8(t, d) { // Karte: herauszoomen, Meer bewegt sich, Ortsmarke pulsiert, Entfernung
    ebene(8, t, { zoom: 1.16 - .1 * ease(t / d), tiefe: .2, wind: [0, 0, .45, .3], windS: 1.6 });
    const z = 1.16 - .1 * ease(t / d), px = W / 2 + (1048 - W / 2) * z, py = H / 2 + (300 - H / 2) * z;
    for (let k = 0; k < 3; k++) { const ph = (t * .7 + k / 3) % 1; ctx.globalAlpha = (1 - ph) * .8; ctx.strokeStyle = FARBE.glut; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(px, py, 20 + ph * 120, 0, 7); ctx.stroke(); } ctx.globalAlpha = 1;
    glut(px, py, t, 26); wort("6 MILES", t - .8, d - .8); },
  9(t, d) { // Menge: Köpfe wiegen sich, Lichtkegel schwenkt, Staub im Licht
    ebene(9, t, { zoom: 1.07 + .02 * ease(t / d), kx: .006 * t, tiefe: .8, wind: [0, .3, 1, 1], windS: 1.1 });
    ctx.save(); ctx.globalCompositeOperation = "lighter"; strahlen(720 + Math.sin(t * .8) * 60, -120, t, 3, .05); ctx.restore();
    staub(t, 60, 21); wort("10–15,000 PEOPLE", t - .6, d - .6); },
  10: { echt: true, f(t, d) { echt(10, t, d, 10); staub(t, 30, 5); } },
  11(t, d) { // Bäckerei: Dampf steigt, Ofen glüht, Hitze flimmert
    ebene(11, t, { zoom: 1.06 + .05 * ease(t / d), kx: -.004 * t, tiefe: .7, hitze: [.18, .05, .55, .45], hitzeS: 1.4 });
    const r = zufall(31);
    for (let i = 0; i < 26; i++) { const ph = (t * .32 + r()) % 1, x = 480 + r() * 440 + Math.sin(t * 1.3 + i) * 26 * ph, y = 450 - ph * 360;
      ctx.globalAlpha = .32 * Math.sin(ph * Math.PI); ctx.fillStyle = "#fff8ea"; ctx.beginPath(); ctx.arc(x, y, 14 + ph * 46, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1; glut(330, 930, t, 50); glut(560, 930, t + 1, 40); },
  12(t, d) { // Amphitheater: aus der Höhe zurückziehen, Vögel, Wolken
    ebene(12, t, { zoom: 1.15 - .09 * ease(t / d), ky: -.004 * t, tiefe: 1.1 });
    for (let i = 0; i < 3; i++) wolke(((i * 760 + t * 30) % 2400) - 220, 70 + (i % 2) * 45, .6, "#fbf3e2", .9);
    schwarm(t, 2000, 300, -150, 6, .6); staub(t, 40, 14); },
  13: { echt: true, f(t, d) { echt(13, t, d, 13); } },
  14(t, d) { // du schaust zum Vesuv: Baum im Wind, Wolken ziehen, langsam heran
    ebene(14, t, { zoom: 1.05 + .06 * ease(t / d), tiefe: 1.2, wind: [.62, 0, 1, .7], windS: 1.3 });
    for (let i = 0; i < 3; i++) wolke(((i * 700 + t * 22) % 2400) - 220, 110 + (i % 2) * 60, .8, "#fbf3e2", .95);
    schwarm(t, -300, 330, 90, 4, .5); },
};

function szeneBei(t) { let n = 1; while (n < Z.length - 1 && t >= Z[n]) n++; return n; }
function zeichne(t) {
  const n = szeneBei(t), lt = t - Z[n - 1], d = Z[n] - Z[n - 1], s = SZ[n];
  ctx.clearRect(0, 0, W, H); (s.f || s)(lt, d);
  if (s.echt) { if (lt < .16) { ctx.fillStyle = `rgba(255,246,228,${(1 - lt / .16) * .7})`; ctx.fillRect(0, 0, W, H); } } // Blitz in den Realclip
  else if (lt < .22) { ctx.fillStyle = `rgba(10,10,14,${(1 - lt / .22) * .9})`; ctx.fillRect(0, 0, W, H); }
  vignette(); korn(t);
  if (t > ENDE - .8) { ctx.fillStyle = `rgba(0,0,0,${clamp((t - ENDE + .8) / .8)})`; ctx.fillRect(0, 0, W, H); }
}
window.zeige = async t => { const n = szeneBei(t); if (SZ[n].echt) await clipLaden(n, t - Z[n - 1], Z[n] - Z[n - 1]); zeichne(t); };
function schleife() { const t = ton.currentTime; zeichne(Math.min(t, ENDE - .01)); document.getElementById("info").textContent = t.toFixed(1) + " s";
  if (t >= ENDE) { ton.pause(); document.getElementById("start").style.display = "grid"; return; } requestAnimationFrame(schleife); }

(async () => {
  const nummern = Array.from({ length: 14 }, (_, i) => i + 1);
  const bilder = await Promise.all(nummern.map(n => ladeBild(`${KONF.bilder}bild_${String(n).padStart(3, "0")}.png`)));
  bilder.forEach((b, i) => texturen[i + 1] = textur(b));
  try { await document.fonts.load("900 100px Montserrat"); } catch (e) {}
  const st = new URLSearchParams(location.search).get("t");
  document.getElementById("info").textContent = "bereit";
  if (KONF.render || st !== null) { document.getElementById("start").style.display = "none"; document.getElementById("info").style.display = "none"; }
  if (st !== null) await window.zeige(parseFloat(st)); else zeichne(.9);
  document.getElementById("start").onclick = () => { document.getElementById("start").style.display = "none"; ton.currentTime = 0; ton.play(); schleife(); };
  window.bereit = true;
})();
</script>
</body>
</html>
