<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bühne</title>
<!-- Baukasten-Animation: EIN durchgehender Raum, wiederkehrende Figuren (Bausteine als Silhouetten), Infografik per Code.
     Bausteine: bilder/<name>.png (schwarze Silhouette auf Weiß) – Weiß wird hier durchsichtig, die Form wird eingefärbt.
     window.KONF (von render_anim.mjs): { bilder: "…/", zeiten: [0, …, ende] }.  Vorbild für den Aufbau: Depth Theory. -->
<style>html, body { margin: 0; background: #000; } #c { width: 100vw; height: auto; display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
const W = 1920, H = 1080, BODEN = 830;
const KONF = Object.assign({ bilder: "bilder/", zeiten: [0, 5, 9.5, 14.5, 19, 24] }, window.KONF || {});
const Z = KONF.zeiten, ENDE = Z[Z.length - 1];
const ctx = document.getElementById("c").getContext("2d");
const F = { hell: "#d7dade", mittel: "#8d939c", dunkel: "#12161d", rot: "#e5383b", weiss: "#f4f5f7" };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => (x = clamp(x), x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const lerp = (a, b, p) => a + (b - a) * p;
function zufall(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const SCHRIFT = "Montserrat, 'Segoe UI', sans-serif";

// ---------- Bausteine laden: Weiß -> durchsichtig, auf die Form zuschneiden ----------
const BAU = {};
function ladeBaustein(name) {
  return new Promise(ok => { const im = new Image();
    im.onload = () => {
      const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
      const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(im, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height), p = d.data; let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
      // Hintergrund: alles, was vom Bildrand aus erreichbar ist und der Randfarbe ähnelt (auch farbige Flächen)
      const bw = c.width, bh = c.height, hg = new Uint8Array(bw * bh), stapel = [], ref = [p[0], p[1], p[2]];
      const aehnlich = (k) => Math.abs(p[k * 4] - ref[0]) + Math.abs(p[k * 4 + 1] - ref[1]) + Math.abs(p[k * 4 + 2] - ref[2]) < 110;
      const rein = (k) => { if (!hg[k] && aehnlich(k)) { hg[k] = 1; stapel.push(k); } };
      for (let q = 0; q < bw; q++) { rein(q); rein((bh - 1) * bw + q); } for (let q = 0; q < bh; q++) { rein(q * bw); rein(q * bw + bw - 1); }
      while (stapel.length) { const k = stapel.pop(), kx = k % bw; if (kx > 0) rein(k - 1); if (kx < bw - 1) rein(k + 1); if (k >= bw) rein(k - bw); if (k < bw * (bh - 1)) rein(k + bw); }
      for (let i = 0; i < p.length; i += 4) { const a = 255 - (p[i] * .3 + p[i + 1] * .59 + p[i + 2] * .11); const al = hg[i / 4] || a < 40 ? 0 : Math.min(255, a * 1.25);
        p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = al;
        if (al > 60) { const px = (i / 4) % c.width, py = Math.floor(i / 4 / c.width); if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; } }
      x.putImageData(d, 0, 0);
      const t = document.createElement("canvas"); t.width = Math.max(1, x1 - x0 + 1); t.height = Math.max(1, y1 - y0 + 1);
      t.getContext("2d").drawImage(c, x0, y0, t.width, t.height, 0, 0, t.width, t.height);
      BAU[name] = { maske: t, farben: {} }; ok();
    };
    im.onerror = () => { BAU[name] = null; ok(); };
    im.src = `${KONF.bilder}${name}.png`; });
}
function gefaerbt(b, farbe) { if (b.farben[farbe]) return b.farben[farbe];
  const c = document.createElement("canvas"); c.width = b.maske.width; c.height = b.maske.height; const x = c.getContext("2d");
  x.drawImage(b.maske, 0, 0); x.globalCompositeOperation = "source-in"; x.fillStyle = farbe; x.fillRect(0, 0, c.width, c.height);
  return (b.farben[farbe] = c); }
// Baustein mit den Füßen auf (x, yBoden), Höhe h. Gibt die Breite zurück.
function baustein(name, x, yBoden, h, o = {}) { const b = BAU[name];
  ctx.save(); ctx.globalAlpha = o.a ?? 1; ctx.translate(x, yBoden); if (o.spiegeln) ctx.scale(-1, 1);
  if (!b) { ctx.fillStyle = o.farbe || F.hell; ctx.fillRect(-h * .22, -h, h * .44, h); ctx.restore(); return h * .44; }
  const w = h * b.maske.width / b.maske.height; ctx.drawImage(gefaerbt(b, o.farbe || F.hell), -w / 2, -h, w, h); ctx.restore(); return w; }

// ---------- Welt: ein Krankenzimmer, das über das ganze Video bleibt ----------
function raum(t, licht) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#161b24"); g.addColorStop(1, "#0a0d12"); ctx.fillStyle = g; ctx.fillRect(-600, -400, W + 1200, H + 800);
  ctx.fillStyle = "#07090d"; ctx.fillRect(-600, BODEN, W + 1200, 700);                                   // Boden
  ctx.strokeStyle = "#2a313c"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-600, BODEN); ctx.lineTo(W + 600, BODEN); ctx.stroke();
  for (let i = -2; i < 12; i++) { ctx.strokeStyle = "#141a22"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(i * 220, BODEN - 500); ctx.lineTo(i * 220, BODEN); ctx.stroke(); }   // Wandpaneele
  const fx = 880, fy = 70, fw = 230, fh = 260;                                                            // Fenster
  const p = licht * (.92 + .08 * Math.sin(t * 1.7));
  ctx.save(); ctx.globalAlpha = .34 * p; ctx.fillStyle = F.weiss; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + fw, fy); ctx.lineTo(fx + fw - 620, BODEN + 250); ctx.lineTo(fx - 1050, BODEN + 250); ctx.fill(); ctx.restore();
  ctx.fillStyle = `rgba(244,245,247,${.2 + .75 * p})`; ctx.fillRect(fx, fy, fw, fh);
  ctx.strokeStyle = "#0a0d12"; ctx.lineWidth = 12; ctx.strokeRect(fx, fy, fw, fh); ctx.beginPath(); ctx.moveTo(fx + fw / 2, fy); ctx.lineTo(fx + fw / 2, fy + fh); ctx.moveTo(fx, fy + fh / 2); ctx.lineTo(fx + fw, fy + fh / 2); ctx.stroke();
  const r = zufall(7); ctx.fillStyle = F.weiss;                                                             // Staub im Licht
  for (let i = 0; i < 60; i++) { const x = 300 + r() * 1100 + Math.sin(t * .5 + i) * 30, y = (r() * 700 + t * (10 + r() * 16)) % 700 + 150; ctx.globalAlpha = p * (.08 + .22 * Math.abs(Math.sin(t * 1.3 + i))); ctx.beginPath(); ctx.arc(x, y, 1.5 + r() * 2.5, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
}

// ---------- Infografik-Bausteine ----------
function zeiger(x, y, tx, ty, text, p, farbe = F.weiss) { if (p <= 0) return; const q = ease(p * 1.6);
  ctx.save(); ctx.strokeStyle = farbe; ctx.fillStyle = farbe; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(lerp(x, tx, q), lerp(y, ty, q)); ctx.stroke();
  const a = clamp((p - .45) * 3); if (a > 0) { ctx.globalAlpha = a; ctx.font = `800 34px ${SCHRIFT}`; ctx.textBaseline = "middle"; ctx.textAlign = tx < x ? "right" : "left";
    ctx.fillText(text, tx + (tx < x ? -14 : 14), ty); const b = ctx.measureText(text).width; ctx.lineWidth = 3; ctx.beginPath(); const u = tx + (tx < x ? -14 - b : 14); ctx.moveTo(u, ty + 26); ctx.lineTo(u + b, ty + 26); ctx.stroke(); }
  ctx.restore(); }
function kreuz(x, y, r, p) { if (p <= 0) return; ctx.save(); ctx.strokeStyle = F.rot; ctx.lineWidth = 12; ctx.lineCap = "round"; const a = ease(clamp(p * 2)), b = ease(clamp(p * 2 - 1));
  ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x - r + 2 * r * a, y - r + 2 * r * a); ctx.stroke();
  if (b > 0) { ctx.beginPath(); ctx.moveTo(x + r, y - r); ctx.lineTo(x + r - 2 * r * b, y - r + 2 * r * b); ctx.stroke(); } ctx.restore(); }
function titel(text, p, y = 96, farbe = F.rot) { if (p <= 0) return; const a = Math.min(ease(p * 4), clamp((1 - p) * 5)); ctx.save(); ctx.globalAlpha = a;
  ctx.font = `900 58px ${SCHRIFT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = farbe; ctx.fillText(text, W / 2, y);
  const b = ctx.measureText(text).width * ease(p * 3); ctx.fillRect(W / 2 - b / 2, y + 42, b, 5); ctx.restore(); }
function fussnote(text, p) { if (p <= 0) return; ctx.save(); ctx.globalAlpha = clamp(p * 4) * .8; ctx.font = `600 28px ${SCHRIFT}`; ctx.textAlign = "center"; ctx.fillStyle = F.mittel; ctx.fillText(text, W / 2, H - 60); ctx.restore(); }
function puls(x, y, b, h, t, a = 1) { ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = F.rot; ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.beginPath();
  for (let i = 0; i <= b; i += 4) { const ph = ((i / b) * 3 - t * 1.1) % 1, u = (ph + 1) % 1; let v = 0;
    if (u > .40 && u < .46) v = -(u - .40) / .06 * .9; else if (u >= .46 && u < .52) v = -.9 + (u - .46) / .06 * 1.5; else if (u >= .52 && u < .58) v = .6 - (u - .52) / .06 * .6;
    i ? ctx.lineTo(x + i, y + v * h) : ctx.moveTo(x + i, y + v * h); } ctx.stroke(); ctx.restore(); }
function optionen(x, y, kopf, liste, p, gestrichen) { if (p <= 0) return; ctx.save(); ctx.textBaseline = "middle"; ctx.textAlign = "left";
  ctx.globalAlpha = clamp(p * 5); ctx.font = `900 46px ${SCHRIFT}`; ctx.fillStyle = F.weiss; ctx.fillText(kopf, x, y);
  liste.forEach((txt, i) => { const q = clamp(p * (liste.length + 1.5) - 1 - i); if (q <= 0) return; const yy = y + 86 + i * 78; ctx.globalAlpha = q;
    ctx.fillStyle = "rgba(255,255,255,.07)"; ctx.fillRect(x, yy - 30, 640, 60); ctx.fillStyle = F.hell; ctx.font = `700 34px ${SCHRIFT}`; ctx.fillText(`${i + 1}.  ${txt}`, x + 20, yy);
    const s = clamp(gestrichen - i); if (s > 0) { ctx.strokeStyle = F.rot; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x + 14, yy); ctx.lineTo(x + 14 + 612 * ease(s), yy); ctx.stroke(); } });
  ctx.restore(); }

// ---------- Ablauf: fünf Szenen im selben Raum, die Kamera wandert ----------
function szeneBei(t) { let n = 1; while (n < Z.length - 1 && t >= Z[n]) n++; return n; }
const KAM = [ { x: 960, y: 540, z: 1.0 }, { x: 960, y: 560, z: 1.08 }, { x: 590, y: 520, z: 1.75 }, { x: 990, y: 640, z: 1.9 }, { x: 760, y: 540, z: 1.0 } ];
function zeichne(t) {
  const n = szeneBei(t), lt = t - Z[n - 1], d = Z[n] - Z[n - 1], p = lt / d;
  const von = KAM[Math.max(0, n - 2)], zu = KAM[n - 1], q = ease(lt / 1.1);                    // Kamerafahrt in 1,1 s, danach langsames Treiben
  const kx = lerp(von.x, zu.x, q) + Math.sin(t * .35) * 8, ky = lerp(von.y, zu.y, q), kz = lerp(von.z, zu.z, q) * (1 + .02 * p);
  const licht = n === 1 ? ease(lt / 2.2) : n === 5 ? lerp(1, .35, ease(lt / 1.5)) : 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(kz, kz); ctx.translate(-kx, -ky);
  raum(t, licht);
  const sicht = n === 1 ? ease((lt - .8) / 1.6) : 1, atem = Math.sin(t * 1.5) * 3;
  baustein("bett", 470, BODEN, 250, { farbe: F.mittel, a: sicht });
  baustein("tisch", 990, BODEN, 240, { farbe: F.mittel, a: sicht });
  baustein("frau", 640, BODEN + atem * .3, 440 + atem, { farbe: n === 5 ? F.weiss : F.hell, a: sicht });
  baustein("arzt", 1420, BODEN, 470 + Math.sin(t * 1.2 + 1) * 2, { farbe: F.hell, a: sicht * (n >= 3 && n <= 4 ? .45 : 1) });
  if (n === 2) { zeiger(1420, 440, 1560, 330, "JULES COTARD", (lt - .4) / 1.4); zeiger(640, 440, 420, 330, "MADEMOISELLE X", (lt - 1.6) / 1.4); }
  if (n === 3) { const s = (k) => (lt - .5 - k * (d - 1.2) / 3) / 1.1;
    zeiger(650, 425, 830, 380, "NO BRAIN", s(0)); kreuz(650, 425, 22, s(0) - .5);
    zeiger(640, 560, 840, 540, "NO NERVES", s(1)); kreuz(640, 560, 22, s(1) - .5);
    zeiger(640, 650, 830, 700, "NO STOMACH", s(2)); kreuz(640, 650, 22, s(2) - .5); }
  if (n === 4) { zeiger(990, 600, 1140, 520, "STOPPED EATING", (lt - .6) / 1.3); kreuz(990, 600, 46, (lt - 1.6) / 1.0); }
  ctx.restore();
  // feste Ebene (bewegt sich nicht mit der Kamera)
  if (n === 1) titel("PARIS, 1880", clamp((lt - .5) / (d - .7)), 110);
  if (n === 4) fussnote("ACCORDING TO COTARD'S REPORT, 1880", (lt - .8) / 1.2);
  if (n === 5) { ctx.fillStyle = `rgba(0,0,0,${.35 * ease(lt / 1.2)})`; ctx.fillRect(0, 0, W, H);
    optionen(1130, 300, "HOW DO YOU PROVE IT?", ["SHOW HER HER PULSE", "HOLD UP A MIRROR", "ARGUE WITH HER"], (lt - .5) / (d * .55), (lt - d * .55) / .7);
    puls(120, 180, 520, 70, t, ease((lt - .4) / 1)); ctx.fillStyle = F.rot; ctx.font = `800 30px ${SCHRIFT}`; ctx.textAlign = "left"; ctx.globalAlpha = ease((lt - .4) / 1); ctx.fillText("PULSE: NORMAL", 120, 290); ctx.globalAlpha = 1; }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.45)"); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (t < .5) { ctx.fillStyle = `rgba(0,0,0,${1 - t / .5})`; ctx.fillRect(0, 0, W, H); }
  if (t > ENDE - .7) { ctx.fillStyle = `rgba(0,0,0,${clamp((t - ENDE + .7) / .7)})`; ctx.fillRect(0, 0, W, H); }
}
window.zeige = async t => zeichne(t);

(async () => {
  await Promise.all(["frau", "arzt", "bett", "tisch"].map(ladeBaustein));
  try { await document.fonts.load(`900 58px Montserrat`); } catch (e) {}
  const st = new URLSearchParams(location.search).get("t");
  zeichne(st !== null ? parseFloat(st) : 6);
  window.bereit = true;
})();
</script>
</body>
</html>
